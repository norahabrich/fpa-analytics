name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,app]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Tests et contrôles de traçabilité
        run: pytest -q

  reproductibilite:
    # Reconstruit Silver, Gold, analyse et prévision depuis les archives Bronze,
    # puis vérifie que les tables versionnées n'ont pas changé.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Reconstruction complète
        run: python -m fpa.pipeline
      - name: Comparaison avec les tables versionnées
        run: python -m fpa.reproducibility
